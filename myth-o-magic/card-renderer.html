<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mytho Magic — Card Renderer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a1a2e;
  --bg-surface: #16213e;
  --bg-card: #0f3460;
  --accent: #e6a817;
  --accent-dim: #b8860b;
  --text: #f0e6d3;
  --text-dim: #a89880;
  --danger: #c0392b;
  --success: #27ae60;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── Top Bar ── */
.topbar {
  background: var(--bg-surface);
  border-bottom: 2px solid var(--accent-dim);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar h1 {
  font-family: Georgia, serif;
  color: var(--accent);
  font-size: 1.4rem;
  white-space: nowrap;
}
.topbar input[type="text"] {
  background: var(--bg);
  border: 1px solid var(--accent-dim);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 4px;
  width: 220px;
  font-size: 0.9rem;
}
.topbar select {
  background: var(--bg);
  border: 1px solid var(--accent-dim);
  color: var(--text);
  padding: 6px 8px;
  border-radius: 4px;
  font-size: 0.9rem;
}
.topbar .stats {
  margin-left: auto;
  color: var(--text-dim);
  font-size: 0.85rem;
}
.btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-dim));
  color: #1a1a1a;
  border: none;
  padding: 6px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.85rem;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.btn.secondary {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--accent-dim);
}

/* ── Layout ── */
.app { display: flex; height: calc(100vh - 56px); }

.grid-panel {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}

.card-thumb {
  cursor: pointer;
  border-radius: 8px;
  overflow: hidden;
  border: 2px solid transparent;
  transition: border-color 0.2s, transform 0.2s;
  background: var(--bg-surface);
}
.card-thumb:hover { border-color: var(--accent); transform: translateY(-2px); }
.card-thumb.selected { border-color: var(--accent); box-shadow: 0 0 12px rgba(230,168,23,0.4); }
.card-thumb .thumb-render { width: 100%; aspect-ratio: 2/3; }
.card-thumb .thumb-label {
  padding: 6px 8px;
  font-size: 0.75rem;
  color: var(--text-dim);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Detail Panel ── */
.detail-panel {
  width: 860px;
  min-width: 860px;
  background: var(--bg-surface);
  border-left: 2px solid var(--accent-dim);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.detail-panel.hidden { display: none; }
.detail-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--accent-dim);
  display: flex;
  align-items: center;
  gap: 12px;
}
.detail-header h2 { font-family: Georgia, serif; color: var(--accent); font-size: 1.1rem; }
.detail-body {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 16px;
  flex: 1;
  overflow-y: auto;
  align-items: center;
}
.detail-preview {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.detail-edit {
  width: 100%;
  max-width: 600px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field-row {
  display: flex;
  gap: 8px;
  align-items: start;
}
.field-row label {
  width: 100px;
  min-width: 100px;
  font-size: 0.8rem;
  color: var(--text-dim);
  padding-top: 6px;
  text-align: right;
}
.field-row input, .field-row textarea, .field-row select {
  flex: 1;
  background: var(--bg);
  border: 1px solid #333;
  color: var(--text);
  padding: 5px 8px;
  border-radius: 3px;
  font-size: 0.85rem;
  font-family: inherit;
}
.field-row textarea { resize: vertical; min-height: 50px; }
.field-row .half { display: flex; gap: 8px; flex: 1; }
.field-row .half input { flex: 1; }

/* ══════════════════════════════════════════
   CARD RENDER — Frame Overlay Approach
   ══════════════════════════════════════════ */
.mytho-card {
  width: 440px;
  height: 660px;
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  font-family: Georgia, 'Times New Roman', serif;
  background: #111;
}

/* Layer 1: Art fills the entire card behind everything */
.card-art-wrap {
  position: absolute;
  inset: 0;
  z-index: 1;
}
.card-art-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 20%;
  display: block;
}
.card-art-wrap .art-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #2a2a3a, #1a1a2a);
  color: var(--text-dim);
  font-size: 1rem;
}

/* Layer 2: Frame PNG overlay — sits on top of art */
.card-frame-overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}
.card-frame-overlay img {
  width: 100%;
  height: 100%;
  display: block;
}

/* Layer 3: All text elements — on top of everything */

/* Game title — small "Myth-o-Magic" text centered in blue header */
.card-game-title {
  position: absolute;
  top: 28px;
  left: 60px;
  right: 60px;
  z-index: 20;
  text-align: center;
  font-size: 0.54rem;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 3.5px;
  color: rgba(230,210,170,0.9);
  text-shadow: 0 0 4px rgba(0,0,0,0.9);
}

/* Card Name — centered in the dark header bar at top */
.card-name-text {
  position: absolute;
  top: 48px;
  left: 60px;
  right: 60px;
  z-index: 20;
  text-align: center;
  font-size: 1.3rem;
  font-weight: bold;
  color: #f0e6d3;
  text-shadow: 0 0 8px rgba(0,0,0,0.9), 0 2px 4px rgba(0,0,0,0.8);
  line-height: 1.2;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 45px;
}

/* Corner icon — top-left shield area */
/* Shield: icon centered in blue area. Measured: center=(48,64), size=44x55 */
.card-corner-tl {
  position: absolute;
  top: 37px;
  left: 26px;
  z-index: 20;
  width: 44px;
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-corner-tl img {
  width: 65%;
  height: 65%;
  object-fit: contain;
  filter: drop-shadow(0 0 2px rgba(0,0,0,0.6));
}

/* Circle badge: icon centered in gold ring. Measured: center=(414,49), radius=22 */
.card-corner-tr {
  position: absolute;
  top: 29px;
  right: 6px;
  z-index: 20;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #1a1a2e;
  overflow: hidden;
}
.card-corner-tr img {
  width: 72%;
  height: 72%;
  object-fit: contain;
}

/* Status badge — centered on gold banner. Measured: y=86-111, center x=46 */
.card-status-badge {
  position: absolute;
  top: 86px;
  left: 20px;
  z-index: 20;
  width: 52px;
  text-align: center;
  padding: 0;
  font-size: 0.42rem;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #2a1e10;
  text-shadow: 0 1px 1px rgba(255,220,150,0.4);
  background: none;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 25px;
}

/* Tier badge — hidden for now, frame provides visual tier via shield color */
.card-tier-badge {
  display: none;
}

/* Subtitle banner — text overlaid on the frame's ribbon */
.card-subtitle-banner {
  position: absolute;
  bottom: 240px;
  left: 65px;
  right: 65px;
  z-index: 20;
  text-align: center;
  padding: 4px 10px;
  font-size: 1.1rem;
  font-style: italic;
  color: #2a2010;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 30px;
}

/* Stats bar — ATK and HP values overlaid on the frame's stat boxes (stats = 66.4%–72.9% → bottom: 179–222px) */
.card-stats-bar {
  position: absolute;
  bottom: 188px;
  left: 28px;
  right: 28px;
  z-index: 20;
  display: flex;
  gap: 8px;
  justify-content: center;
}
.stat-box {
  flex: 1;
  max-width: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 2px 8px;
  font-weight: bold;
  height: 32px;
  position: relative;
}
.stat-atk {
  padding-left: 35px;
}
.stat-hp {
  padding-right: 10px;
}
.stat-icon {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  object-fit: contain;
}
.stat-value {
  font-size: 1.0rem;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  margin-left: 2px;
}
.stat-label {
  font-size: 0.28rem;
  color: rgba(255,255,255,0.6);
  text-transform: uppercase;
  letter-spacing: 0;
  margin-left: 1px;
  align-self: center;
}

/* Special section — text overlaid on the frame's parchment area (parchment starts at ~73%) */
.card-special-section {
  position: absolute;
  bottom: 50px;
  left: 40px;
  right: 40px;
  top: 500px;
  z-index: 20;
  padding: 6px 10px;
  overflow: hidden;
}
.special-header {
  font-size: 0.65rem;
  color: #2a1808;
  margin-bottom: 4px;
  font-weight: bold;
}
.special-header strong {
  font-size: 0.78rem;
  color: #1a0e04;
  font-weight: 900;
}
.special-desc {
  font-size: 0.62rem;
  color: #2a1e10;
  font-weight: 600;
  line-height: 1.35;
}

/* Quote — centered in the blue field at the bottom of the frame */
.card-quote {
  position: absolute;
  bottom: 26px;
  left: 50px;
  right: 50px;
  z-index: 20;
  text-align: center;
  font-size: 0.44rem;
  font-style: italic;
  font-weight: bold;
  color: #ffffff;
  line-height: 1.2;
  text-shadow: 0 1px 3px rgba(0,0,0,0.9);
}

/* ══════════════════════════════════════════
   EXPORT STAGE — Scaled-up for high-res PNG
   ══════════════════════════════════════════ */
.export-stage {
  position: fixed;
  left: -9999px;
  top: 0;
}
.export-stage .mytho-card {
  width: 1024px;
  height: 1536px;
  border-radius: 28px;
}
.export-stage .card-game-title { top: 65px; left: 140px; right: 140px; font-size: 1.26rem; letter-spacing: 8px; }
.export-stage .card-name-text { top: 112px; left: 140px; right: 140px; font-size: 3rem; height: 105px; }
.export-stage .card-corner-tl { top: 88px; left: 42px; width: 88px; height: 98px; }
.export-stage .card-corner-tl img { width: 80%; height: 80%; }
.export-stage .card-corner-tr { top: 61px; right: 40px; width: 116px; height: 116px; }
.export-stage .card-corner-tr img { width: 80%; height: 80%; }
.export-stage .card-status-badge { top: 217px; left: 12px; width: 144px; font-size: 0.98rem; height: 33px; display: flex; align-items: center; justify-content: center; }
.export-stage .card-tier-badge { display: none; }
.export-stage .card-subtitle-banner { bottom: 558px; left: 151px; right: 151px; font-size: 2.56rem; padding: 9px 23px; height: 70px; }
.export-stage .card-stats-bar { bottom: 438px; left: 65px; right: 65px; gap: 19px; }
.export-stage .stat-box { padding: 9px 19px; max-width: 419px; height: 74px; }
.export-stage .stat-atk { padding-left: 70px; }
.export-stage .stat-hp { padding-left: 19px; }
.export-stage .stat-icon { width: 32px; height: 32px; }
.export-stage .stat-value { font-size: 2.56rem; margin-left: 5px; }
.export-stage .stat-label { font-size: 0.74rem; margin-left: 5px; }
.export-stage .card-special-section { bottom: 116px; left: 93px; right: 93px; top: 1165px; padding: 14px 23px; }
.export-stage .special-header { font-size: 1.51rem; margin-bottom: 7px; }
.export-stage .special-header strong { font-size: 1.74rem; }
.export-stage .special-desc { font-size: 1.4rem; line-height: 1.3; font-weight: 600; }
.export-stage .card-quote { bottom: 51px; left: 116px; right: 116px; font-size: 1.02rem; }

/* ── Loading state ── */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  font-size: 1.2rem;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 4px; }

/* ── Batch export progress ── */
.batch-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  flex-direction: column;
  gap: 16px;
}
.batch-overlay.hidden { display: none; }
.batch-bar {
  width: 400px;
  height: 20px;
  background: var(--bg);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--accent-dim);
}
.batch-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-dim));
  transition: width 0.3s;
}
</style>
</head>
<body>

<div class="topbar">
  <h1>Mytho Magic</h1>
  <input type="text" id="search" placeholder="Search cards..." oninput="filterCards()">
  <select id="filterType" onchange="filterCards()">
    <option value="">All Types</option>
  </select>
  <select id="filterMythology" onchange="filterCards()">
    <option value="">All Mythologies</option>
    <option value="Greek">Greek</option>
    <option value="Roman">Roman</option>
  </select>
  <select id="filterTier" onchange="filterCards()">
    <option value="">All Tiers</option>
    <option value="I">Tier I</option>
    <option value="II">Tier II</option>
    <option value="III">Tier III</option>
  </select>
  <button class="btn" onclick="exportCurrent()">Export Card</button>
  <button class="btn secondary" onclick="batchExport()">Export All</button>
  <span class="stats" id="cardCount"></span>
</div>

<div class="app">
  <div class="grid-panel">
    <div class="card-grid" id="cardGrid"></div>
  </div>
  <div class="detail-panel hidden" id="detailPanel">
    <div class="detail-header">
      <h2 id="detailTitle">Card Details</h2>
      <button class="btn secondary" onclick="closeDetail()" style="margin-left:auto;">Close</button>
    </div>
    <div class="detail-body">
      <div class="detail-preview">
        <div id="detailCard"></div>
        <button class="btn" onclick="exportCurrent()">Export PNG</button>
      </div>
      <div class="detail-edit" id="detailEdit"></div>
    </div>
  </div>
</div>

<div class="export-stage" id="exportStage"></div>
<div class="batch-overlay hidden" id="batchOverlay">
  <div style="color:var(--accent);font-size:1.3rem;font-weight:bold;" id="batchLabel">Exporting...</div>
  <div class="batch-bar"><div class="batch-bar-fill" id="batchFill" style="width:0%"></div></div>
</div>

<script>
/* ── Icon map — maps CSV corner_icon values to icon image filenames ── */
const ICON_MAP = {
  'lightning bolt': 'lightning-bolt', 'trident': 'trident', 'skull': 'skull', 'owl': 'owl',
  'flame': 'flame', 'heart': 'heart', 'bow': 'bow', 'bow and moon': 'bow-and-moon',
  'crossed swords': 'crossed-swords', 'sword': 'sword', 'hammer': 'hammer', 'hammer and anvil': 'hammer-and-anvil',
  'lyre': 'lyre', 'sun': 'sun', 'eagle': 'eagle', 'paw print': 'paw-print',
  'spear': 'spear', 'baseball bat': 'baseball-bat', 'reed pipes': 'reed-pipes', 'gem': 'gem',
  'crown': 'crown', 'crystal ball': 'crystal-ball', 'scythe': 'scythe', 'tree': 'tree',
  'star': 'star', 'cat': 'cat', 'seashell': 'seashell', 'twin stars': 'twin-stars',
  'spider': 'spider', 'chains': 'chains', 'fury wings': 'fury-wings', 'wolf': 'wolf-head',
  'wolf head': 'wolf-head', 'eye': 'eye', 'glowing eyes': 'glowing-eyes', 'blind eye': 'blind-eye',
  'eye of prophecy': 'eye-of-prophecy', 'scales': 'scales', 'triple moon': 'triple-moon',
  'snowflake': 'snowflake', 'two faces': 'two-faces', 'gorgon head': 'gorgon-head',
  'gorgon mask': 'gorgon-mask', 'bull head': 'bull-head', 'lion head': 'lion-head',
  'scorpion tail': 'scorpion-tail', 'gear/cog': 'gear-cog', 'gear/hammer': 'gear-hammer',
  'earth globe': 'earth-globe', 'earth symbol': 'earth-globe', 'dark flame': 'dark-flame',
  'hooded spirits': 'hooded-spirits', 'hearth flame': 'hearth-flame', 'wheat/trident': 'wheat-trident',
  'peacock': 'peacock', 'helm of darkness': 'helm-of-darkness', 'gold coins': 'gold-coins',
  'scroll': 'scroll', 'compass': 'compass', 'crossed axes': 'crossed-axes',
  'dagger': 'dagger', 'laurel wreath': 'laurel-wreath', 'vine': 'vine',
  'nightmare flame': 'nightmare-flame', 'golden hand': 'golden-hand', 'three-headed dog': 'three-headed-dog',
  'caduceus': 'caduceus',
};
function getIconSrc(iconKey) {
  const slug = ICON_MAP[(iconKey || '').toLowerCase()] || 'crossed-swords';
  return 'Card-Art/icons/' + slug + '.png';
}

/* ── Status icon — maps card status to status icon filename ── */
function getStatusIconSrc(status) {
  const slug = (status || 'god').toLowerCase().replace(/\s+/g, '-');
  return 'Card-Art/icons/status/' + slug + '.png';
}

/* ── Frame image path ── */
const FRAME_PATH = 'Card-Art/frame.png';

let cards = [];
let selectedIdx = -1;

/* ── CSV parser ── */
function parseCSV(text) {
  const lines = text.split('\n');
  const result = [];
  for (const line of lines) {
    if (!line.trim()) continue;
    const fields = [];
    let field = '';
    let quoted = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (quoted) {
        if (ch === '"' && line[i+1] === '"') { field += '"'; i++; }
        else if (ch === '"') { quoted = false; }
        else { field += ch; }
      } else {
        if (ch === '"') { quoted = true; }
        else if (ch === ',') { fields.push(field); field = ''; }
        else { field += ch; }
      }
    }
    fields.push(field);
    result.push(fields);
  }
  return result;
}

/* ── Google Sheets published CSV URL ── */
const SHEETS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSzJoYGBm1ByGsJFr_w8o0wpmoCy0QsaPlGZV_GYhxGuHUhebRnVktFb-91RHpVBVN6nFK1V6O5Kqni/pub?output=csv';

/* ── Load CSV — tries Google Sheets first, falls back to local file ── */
async function loadCSV() {
  let text;
  try {
    // Primary: fetch from published Google Sheet (live-editable)
    const resp = await fetch(SHEETS_CSV_URL);
    if (!resp.ok) throw new Error('Sheets fetch failed');
    text = await resp.text();
  } catch (e1) {
    try {
      // Fallback: local CSV file (for offline / local dev)
      const resp2 = await fetch('mythomagic-cards.csv');
      if (!resp2.ok) throw new Error('Local fetch failed');
      text = await resp2.text();
    } catch (e2) {
      document.getElementById('cardGrid').innerHTML = '<div class="loading">Failed to load card data. Check your internet connection or serve locally with: python3 -m http.server 8765</div>';
      return;
    }
  }
  const rows = parseCSV(text);
  const headers = rows[0];
  let allCards = rows.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => obj[h.trim()] = (row[i] || '').trim());
    return obj;
  });

  // Filter: only keep cards that have an art_filename AND the image actually exists
  const artChecks = await Promise.all(allCards.map(async (card) => {
    if (!card.art_filename) return false;
    try {
      const path = getArtPath(card);
      if (!path) return false;
      const resp = await fetch(path, { method: 'HEAD' });
      if (resp.ok) return true;
      // Try fallbacks
      const fb1 = getArtFallback(card);
      if (fb1) { const r2 = await fetch(fb1, { method: 'HEAD' }); if (r2.ok) return true; }
      const fb2 = getArtFallback2(card);
      if (fb2) { const r3 = await fetch(fb2, { method: 'HEAD' }); if (r3.ok) return true; }
      return false;
    } catch { return false; }
  }));
  cards = allCards.filter((_, i) => artChecks[i]);

  populateFilters();
  renderGrid();
}

function populateFilters() {
  const types = [...new Set(cards.map(c => c.status))].sort();
  const sel = document.getElementById('filterType');
  types.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    sel.appendChild(opt);
  });
}

/* ── Art path resolver ── */
/* Primary: Card-Art/ (high-res, clean). Fallbacks: old folders.
   macOS uses NFD unicode (decomposed), CSV uses NFC (precomposed).
   We try both forms to handle special chars like ê, ë, ' */
function normNFD(s) { return s.normalize('NFD'); }
function normNFC(s) { return s.normalize('NFC'); }
function getArtPath(card) {
  const fn = card.art_filename;
  if (!fn) return null;
  return 'Card-Art/' + encodeURIComponent(normNFD(fn));
}
function getArtFallback(card) {
  const fn = card.art_filename;
  if (!fn) return null;
  return 'Card-Art/' + encodeURIComponent(normNFC(fn));
}
function getArtFallback2(card) {
  const name = card.name;
  if (!name) return null;
  return 'Card-Art/' + encodeURIComponent(name) + '.png';
}

/* ══════════════════════════════════════════
   Render a single card as HTML
   Art → Frame overlay → Text on top
   ══════════════════════════════════════════ */
function renderCardHTML(card) {
  const iconSrc = getIconSrc(card.corner_icon);
  const statusIconSrc = getStatusIconSrc(card.status);
  const artPrimary = getArtPath(card);
  const artFallback = getArtFallback(card);
  const artFallback2 = getArtFallback2(card);

  return `
    <div class="mytho-card">
      <!-- Layer 1: Character Art -->
      <div class="card-art-wrap">
        <img src="${artPrimary || ''}"
             onerror="this.onerror=function(){
               this.onerror=function(){this.style.display='none'; this.nextElementSibling.style.display='flex';};
               this.src='${artFallback2 || ''}';
             }; this.src='${artFallback || ''}';"
             alt="${card.name}">
        <div class="art-placeholder" style="display:none;">${card.name}</div>
      </div>

      <!-- Layer 2: Frame Overlay -->
      <div class="card-frame-overlay">
        <img src="${FRAME_PATH}" alt="frame">
      </div>

      <!-- Layer 3: Text Content -->
      <div class="card-game-title">Myth-o-Magic</div>
      <div class="card-corner-tl"><img src="${statusIconSrc}" alt="${card.status}"></div>
      <div class="card-corner-tr"><img src="${iconSrc}" alt="${card.corner_icon}"></div>
      <div class="card-name-text">${card.name || ''}</div>
      <div class="card-status-badge">${card.status || ''}</div>
      <div class="card-subtitle-banner">${card.subtitle || ''}</div>
      <div class="card-stats-bar">
        <div class="stat-box stat-atk">
          <svg class="stat-icon" viewBox="0 0 24 24" fill="white"><path d="M6.92 5H5l4 4H7L3 5V3h2l4 4V5h2v4l4-4h2v2l-4 4h2l4-4h2v1.92L11 13v2l5 5-1.42 1.42L10 16.84l-4.58 4.58L4 20l5-5v-2L6.92 5z"/></svg>
          <span class="stat-value">${card.atk || '?'}</span>
          <span class="stat-label">Attack</span>
        </div>
        <div class="stat-box stat-hp">
          <svg class="stat-icon" viewBox="0 0 24 24" fill="white"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          <span class="stat-value">${card.hp || '?'}</span>
          <span class="stat-label">Health</span>
        </div>
      </div>
      <div class="card-special-section">
        <div class="special-header">Special Attack: <strong>${card.special_name || ''}</strong></div>
        <div class="special-desc">${card.special_description || ''}</div>
      </div>
      <div class="card-quote">${card.quote ? '\u201c' + card.quote + '\u201d' : ''}</div>
    </div>`;
}

/* ── Grid ── */
function renderGrid() {
  const grid = document.getElementById('cardGrid');
  const filtered = getFiltered();
  document.getElementById('cardCount').textContent = `${filtered.length} / ${cards.length} cards`;

  grid.innerHTML = filtered.map((c, fi) => {
    const realIdx = cards.indexOf(c);
    return `<div class="card-thumb ${realIdx === selectedIdx ? 'selected' : ''}" onclick="selectCard(${realIdx})">
      <div class="thumb-render">${renderCardHTML(c)}</div>
      <div class="thumb-label">${c.name}</div>
    </div>`;
  }).join('');

  // Scale thumbs
  grid.querySelectorAll('.thumb-render').forEach(el => {
    el.style.transform = 'scale(' + (el.parentElement.offsetWidth / 440) + ')';
    el.style.transformOrigin = 'top left';
    el.style.height = (660 * el.parentElement.offsetWidth / 440) + 'px';
  });
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const type = document.getElementById('filterType').value;
  const myth = document.getElementById('filterMythology').value;
  const tier = document.getElementById('filterTier').value;
  return cards.filter(c => {
    if (q && !c.name.toLowerCase().includes(q) && !c.card_id.toLowerCase().includes(q)) return false;
    if (type && c.status !== type) return false;
    if (myth && c.mythology !== myth) return false;
    if (tier && c.tier !== tier) return false;
    return true;
  });
}

function filterCards() { renderGrid(); }

/* ── Detail panel ── */
function selectCard(idx) {
  selectedIdx = idx;
  const card = cards[idx];
  const panel = document.getElementById('detailPanel');
  panel.classList.remove('hidden');
  document.getElementById('detailTitle').textContent = card.name;
  document.getElementById('detailCard').innerHTML = renderCardHTML(card);

  const fields = [
    ['card_id', 'Card ID', 'text'],
    ['name', 'Name', 'text'],
    ['subtitle', 'Subtitle', 'text'],
    ['status', 'Type', 'text'],
    ['mythology', 'Mythology', 'text'],
    ['tier', 'Tier', 'text'],
    ['atk', 'Attack', 'number'],
    ['hp', 'Health', 'number'],
    ['special_name', 'Special Name', 'text'],
    ['special_description', 'Special Desc', 'textarea'],
    ['quote', 'Quote', 'text'],
    ['role', 'Role', 'text'],
    ['corner_icon', 'Corner Icon', 'text'],
    ['art_filename', 'Art File', 'text'],
    ['design_note', 'Design Note', 'textarea'],
  ];

  const edit = document.getElementById('detailEdit');
  edit.innerHTML = fields.map(([key, label, type]) => {
    const val = (card[key] || '').replace(/"/g, '&quot;');
    if (type === 'textarea') {
      return `<div class="field-row"><label>${label}</label><textarea data-field="${key}" oninput="updateField(${idx},'${key}',this.value)">${card[key] || ''}</textarea></div>`;
    }
    return `<div class="field-row"><label>${label}</label><input type="${type}" data-field="${key}" value="${val}" oninput="updateField(${idx},'${key}',this.value)"></div>`;
  }).join('') + `
    <div class="field-row" style="margin-top:8px;">
      <label></label>
      <button class="btn secondary" onclick="downloadCSV()">Download Updated CSV</button>
    </div>`;

  renderGrid();
}

function updateField(idx, field, value) {
  cards[idx][field] = value;
  document.getElementById('detailCard').innerHTML = renderCardHTML(cards[idx]);
  document.getElementById('detailTitle').textContent = cards[idx].name;
  renderGrid();
}

function closeDetail() {
  selectedIdx = -1;
  document.getElementById('detailPanel').classList.add('hidden');
  renderGrid();
}

/* ── Export ── */
async function exportCurrent() {
  if (selectedIdx < 0) return alert('Select a card first');
  const card = cards[selectedIdx];
  await exportCardPNG(card);
}

async function exportCardPNG(card) {
  const stage = document.getElementById('exportStage');
  stage.innerHTML = renderCardHTML(card);

  // Wait for all images (art + frame) to load
  const imgs = stage.querySelectorAll('img');
  await Promise.all([...imgs].map(img => new Promise(res => {
    if (img.complete) return res();
    img.onload = res;
    img.onerror = res;
  })));

  await new Promise(r => setTimeout(r, 150));

  const cardEl = stage.querySelector('.mytho-card');
  const canvas = await html2canvas(cardEl, {
    width: 1024, height: 1536,
    scale: 1,
    useCORS: true,
    backgroundColor: '#111',
  });

  const link = document.createElement('a');
  link.download = (card.card_id || 'card') + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  stage.innerHTML = '';
}

async function batchExport() {
  const overlay = document.getElementById('batchOverlay');
  const label = document.getElementById('batchLabel');
  const fill = document.getElementById('batchFill');
  overlay.classList.remove('hidden');

  for (let i = 0; i < cards.length; i++) {
    label.textContent = `Exporting ${i + 1} / ${cards.length}: ${cards[i].name}`;
    fill.style.width = ((i + 1) / cards.length * 100) + '%';
    await exportCardPNG(cards[i]);
    await new Promise(r => setTimeout(r, 200));
  }

  overlay.classList.add('hidden');
}

/* ── Download updated CSV ── */
function downloadCSV() {
  const headers = ['card_id','name','subtitle','status','mythology','tier','atk','hp','special_name','special_description','quote','role','design_note','corner_icon','art_filename'];
  const lines = [headers.join(',')];
  cards.forEach(c => {
    const row = headers.map(h => {
      const v = c[h] || '';
      if (v.includes(',') || v.includes('"') || v.includes('\n')) {
        return '"' + v.replace(/"/g, '""') + '"';
      }
      return v;
    });
    lines.push(row.join(','));
  });
  const blob = new Blob([lines.join('\n')], {type: 'text/csv'});
  const link = document.createElement('a');
  link.download = 'mythomagic-cards.csv';
  link.href = URL.createObjectURL(blob);
  link.click();
}

/* ── Resize observer for thumb scaling ── */
const resizeObs = new ResizeObserver(() => {
  document.querySelectorAll('.thumb-render').forEach(el => {
    const w = el.parentElement.offsetWidth;
    if (w > 0) {
      el.style.transform = 'scale(' + (w / 440) + ')';
      el.style.transformOrigin = 'top left';
      el.style.height = (660 * w / 440) + 'px';
    }
  });
});
resizeObs.observe(document.body);

/* ── Init ── */
loadCSV();
</script>
